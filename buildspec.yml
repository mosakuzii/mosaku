version: 0.2

env:
  parameter-store:
    ssh_key: mosaku-ec2.pem
    CODECOMMIT_USERNAME: codecommit-username-parameter
    CODECOMMIT_TOKEN: codecommit-token-parameter

phases:
  install:
    runtime-versions:
      php: 8.2
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - sudo yum -y update
      - sudo yum -y install zip unzip
      - curl -sS https://getcomposer.org/installer | php
      - mv composer.phar /usr/local/bin/composer

  pre_build:
    commands:
      - echo Starting pre-build phase...
      - cp .env.example .env

  build:
    commands:
      - echo Build started on `date`
      - composer install --no-interaction --prefer-dist
      - php artisan key:generate
      - npm install
      - npm run build

  post_build:
    commands:
      - echo Build completed on `date`
      - echo "$ssh_key" > ~/mosaku-ec2.pem
      - chmod 0600 ~/mosaku-ec2.pem
      - |
        ssh -o StrictHostKeyChecking=no -i ~/mosaku-ec2.pem ec2-user@52.193.94.244 << EOF
        cd /var/www/mosaku
        git config --global credential.helper store
        echo "https://$CODECOMMIT_USERNAME:$CODECOMMIT_TOKEN@git-codecommit.ap-northeast-1.amazonaws.com/v1/repos/mosaku" > ~/.git-credentials
        git pull origin master
        php artisan config:cache
        php artisan route:cache
        php artisan cache:clear
        php artisan view:cache
        php artisan migrate --force
        rm -rf ~/.npm
        rm -rf node_modules
        rm package-lock.json
        npm install
        npm run build
        EOF

artifacts:
  files:
    - app/**
    - bootstrap/**
    - config/**
    - database/**
    - public/**
    - resources/**
    - routes/**
    - storage/**
    - vendor/**
    - .env
    - artisan
    - composer.json
    - composer.lock
    - package.json
    - webpack.mix.js

cache:
  paths:
    - vendor/**
    - node_modules/**
